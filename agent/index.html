<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IT Support</title>
  <link rel="stylesheet" href="style.css">
  <!-- Content Security Policy to allow inline styles and local scripts -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http: https: ws: wss:;">
</head>
<body>
  <div id="app">
    <div id="main-view">
      <div class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <img src="icon.png" alt="Logo" style="width: 28px; height: 28px; border-radius: 6px;">
          <h2>AhasaTV Support</h2>
        </div>
        <div>
          <button id="minimize-btn" class="icon-btn">➖</button>
          <button id="settings-btn" class="icon-btn">⚙️</button>
        </div>
      </div>
      
      <div class="status-box">
        <div id="status-icon" class="idle">Ready</div>
        <p id="status-text">Click below to request help from IT.</p>
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <textarea id="request-message" placeholder="Optional: What do you need help with?" rows="2" style="resize: none;"></textarea>
      </div>

      <button id="request-btn" class="main-btn">Request Help</button>
    </div>

    <div id="settings-view" class="hidden">
      <div class="header">
        <h2>Settings</h2>
        <button id="back-btn" class="icon-btn">❌</button>
      </div>
      <div class="form-group">
        <label>PC Number</label>
        <input type="text" id="pc-number" placeholder="e.g. PC-01">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. John Doe">
      </div>
      <div class="form-group">
        <label>Server IP</label>
        <input type="text" id="server-ip" placeholder="http://192.168.1.100:4000">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button id="save-btn" class="main-btn" style="flex: 1;">Save</button>
        <button id="quit-btn" class="main-btn" style="flex: 1; background-color: #ef4444;">Exit App</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
